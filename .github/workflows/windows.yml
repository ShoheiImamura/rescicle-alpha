name: build-windows-installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  make:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: rescicle-windows
          path: out/make/**/*
