name: release

# Builds the Windows installer and publishes it to the GitHub Release for the
# pushed tag. Tag v0.0.4 must correspond to "version": "0.0.4" in package.json;
# the guard step below fails fast on a mismatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run make

      # Uploads with `gh` rather than electron-forge's publisher-github: the
      # publisher exits 0 without creating a release when it ends up with no
      # artifacts, so a green step did not mean the installer was published.
      # The closing `gh release view` fails the job if the asset is missing.
      - name: Publish the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe="out/make/squirrel.windows/x64/rescicle-Setup.exe"
          test -f "$exe"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" --json assets \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s).assets||[];console.log(a.map(x=>x.name+" "+x.size).join("\n"));if(!a.some(x=>x.name==="rescicle-Setup.exe")){console.error("rescicle-Setup.exe is missing from the release");process.exit(1)}})'

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: rescicle-windows-x64
          path: out/make/squirrel.windows/x64/rescicle-Setup.exe
          if-no-files-found: error
