name: release

# Builds the Windows installer and publishes it to the GitHub Release for the
# pushed tag. Tag v0.0.6 must correspond to "version": "0.0.6" in package.json;
# the guard step below fails fast on a mismatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # package.json, Cargo.toml and tauri.conf.json all carry the version, and
      # only the first one is checked above. Catch a half-done bump here.
      - name: Check the three version numbers agree
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "version mismatch between package.json, tauri.conf.json and Cargo.toml" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Tauri names the bundle after the version, but the README link is
      # deliberately version-free so it keeps working across releases. Take the
      # exact name the version implies rather than globbing: a glob would quietly
      # pick up a stale bundle from an earlier version and ship it.
      - name: Collect the installer under its stable name
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          src="src-tauri/target/release/bundle/nsis/rescicle_${ver}_x64-setup.exe"
          test -f "$src"
          cp "$src" rescicle-Setup.exe
          ls -la rescicle-Setup.exe

      # Uploads with `gh` rather than a bundler's own publisher: publishers tend
      # to exit 0 without creating a release when they end up with no artifacts,
      # so a green step did not mean the installer was published. The closing
      # `gh release view` fails the job if the asset is missing.
      - name: Publish the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe="rescicle-Setup.exe"
          test -f "$exe"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # A draft release is invisible to anyone who is not signed in, and
          # releases/latest/download only ever resolves against published ones,
          # so state outright that this release is published and is the latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          # `isLatest` is not a field every gh build knows, and asking for one it
          # does not know makes gh exit non-zero and hand the empty output to
          # node, which then fails on "Unexpected end of JSON input" and hides
          # what the check was for. Marking the release latest is the job of the
          # edit above; what is verified here is that it is published and that
          # the installer is actually attached.
          gh release view "$GITHUB_REF_NAME" --json isDraft,url,assets \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const names=(r.assets||[]).map(a=>a.name);console.log("url:",r.url,"| draft:",r.isDraft,"| assets:",names.join(", ")||"(none)");if(r.isDraft){console.error("release is still a draft");process.exit(1)}if(!names.includes("rescicle-Setup.exe")){console.error("rescicle-Setup.exe is missing from the release");process.exit(1)}})'

          # The check that actually matters: the link the README hands people. A
          # green job that leaves it 404ing is the whole reason this step exists.
          # Publishing a draft does not make /releases/latest/download resolve at
          # once, so give it a couple of minutes before calling it broken.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/rescicle-Setup.exe"
          code=""
          for attempt in $(seq 1 24); do
            code=$(curl -sL --range 0-0 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "attempt $attempt: $url -> $code"
            case "$code" in 200|206) echo "the download link resolves"; exit 0;; esac
            sleep 5
          done
          echo "the README download link still does not resolve (last status: $code)" >&2
          exit 1

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: rescicle-windows-x64
          path: rescicle-Setup.exe
          if-no-files-found: error
