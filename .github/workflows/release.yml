name: release

# Builds the Windows installer and publishes it to the GitHub Release for the
# pushed tag. Tag v0.0.4 must correspond to "version": "0.0.4" in package.json;
# the guard step below fails fast on a mismatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run make

      # Uploads with `gh` rather than electron-forge's publisher-github: the
      # publisher exits 0 without creating a release when it ends up with no
      # artifacts, so a green step did not mean the installer was published.
      # The closing `gh release view` fails the job if the asset is missing.
      - name: Publish the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe="out/make/squirrel.windows/x64/rescicle-Setup.exe"
          test -f "$exe"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$exe" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # A draft release is invisible to anyone who is not signed in, and
          # releases/latest/download only ever resolves against published ones,
          # so state outright that this release is published and is the latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          gh release view "$GITHUB_REF_NAME" --json isDraft,isLatest,url,assets \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const names=(r.assets||[]).map(a=>a.name);console.log("url:",r.url,"| draft:",r.isDraft,"| latest:",r.isLatest,"| assets:",names.join(", ")||"(none)");if(r.isDraft){console.error("release is still a draft");process.exit(1)}if(!names.includes("rescicle-Setup.exe")){console.error("rescicle-Setup.exe is missing from the release");process.exit(1)}})'

          # The check that actually matters: the link the README hands people. A
          # green job that leaves it 404ing is the whole reason this step exists.
          # Publishing a draft does not make /releases/latest/download resolve at
          # once, so give it a couple of minutes before calling it broken.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/rescicle-Setup.exe"
          code=""
          for attempt in $(seq 1 24); do
            code=$(curl -sL --range 0-0 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "attempt $attempt: $url -> $code"
            case "$code" in 200|206) echo "the download link resolves"; exit 0;; esac
            sleep 5
          done
          echo "the README download link still does not resolve (last status: $code)" >&2
          exit 1

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: rescicle-windows-x64
          path: out/make/squirrel.windows/x64/rescicle-Setup.exe
          if-no-files-found: error
